<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap');
    *{box-sizing:border-box;}
    body{margin:0;}
    .anton{font-family:'Anton',system-ui,sans-serif;text-transform:uppercase;}
    .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  </style>
</helmet>

<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#faf8ff;color:#211d40;font-family:'Space Grotesk',system-ui,sans-serif;">

  <!-- diagonal wipe: dark clearing to white -->
  <div style="position:absolute;inset:0;background:linear-gradient(115deg,#110d26 0%,#110d26 34%,#3a1f8f 44%,rgba(124,58,237,.15) 54%,transparent 66%);pointer-events:none;"></div>

  <!-- header mid-fade -->
  <div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:34px 56px;">
    <span class="anton" style="font-size:30px;transform:scaleX(.9);transform-origin:left;color:#c9bdf2;">RAYAN</span>
    <span class="mono" style="font-size:11px;letter-spacing:.2em;color:#7c3aed;margin-top:8px;opacity:.6;">01 &nbsp;<span style="border:1px solid #b98cff;padding:1px 8px;">ASSURFAST</span>&nbsp; 05</span>
    <span class="mono" style="font-size:12px;letter-spacing:.14em;color:#6a5f92;">À PROPOS</span>
  </div>

  <!-- opening tile with motion streaks -->
  <div style="position:absolute;left:300px;top:150px;">
    <div style="position:absolute;left:-90px;top:14px;width:520px;height:470px;background:linear-gradient(155deg,#8b52ff,#3a1f8f);opacity:.12;border-radius:6px;"></div>
    <div style="position:absolute;left:-46px;top:8px;width:520px;height:480px;background:linear-gradient(155deg,#8b52ff,#3a1f8f);opacity:.22;border-radius:6px;"></div>
    <div style="position:relative;width:520px;height:490px;background:linear-gradient(155deg,#7c3aed,#2f1f70);border-radius:6px;box-shadow:0 50px 120px -30px rgba(124,58,237,.55);overflow:hidden;">
      <div class="mono" style="position:absolute;top:16px;left:18px;font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.55);">// ouverture…</div>
    </div>
  </div>

  <!-- giant type assembling from below with stagger -->
  <div class="anton" style="position:absolute;left:60px;right:60px;top:250px;display:flex;justify-content:space-between;align-items:flex-end;font-size:190px;line-height:.8;color:#7c3aed;">
    <span style="transform:translateY(4px);opacity:.95;">A</span>
    <span style="transform:translateY(34px);opacity:.8;">S</span>
    <span style="transform:translateY(78px);opacity:.55;">S</span>
    <span style="transform:translateY(120px);opacity:.4;">U</span>
    <span style="transform:translateY(150px);opacity:.28;">R</span>
    <span style="transform:translateY(180px);opacity:.18;">F</span>
    <span style="transform:translateY(200px);opacity:.12;">A</span>
    <span style="transform:translateY(220px);opacity:.08;">S</span>
    <span style="transform:translateY(240px);opacity:.05;">T</span>
  </div>

  <!-- easing streaks -->
  <svg width="1440" height="900" style="position:absolute;inset:0;pointer-events:none;" stroke="#b98cff" stroke-width="1" opacity=".5">
    <path d="M980 470 H1320 M1000 500 H1360 M1030 530 H1300"/>
  </svg>

  <div class="mono" style="position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:11px;letter-spacing:.24em;color:#8b80b8;">TRANSITION · fond qui s'inverse · titre qui monte · tuile qui s'ouvre</div>

</div>
</x-dc>
</body>
</html>
