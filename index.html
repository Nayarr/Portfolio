    <!--
      Le site est une SPA : sans ce bloc, un agregateur qui n'execute pas le JS
      ne voit qu'une div vide. Schema.org donne l'essentiel du profil,
      independamment du rendu.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Rayan Oughlis",
        "url": "%SITE_URL%/",
        "image": "%SITE_URL%/og.jpg",
        "jobTitle": "Développeur full-stack",
        "description": "Développeur full-stack orienté data et automatisation, en recherche d'alternance d'un an.",
        "email": "mailto:rayan.oughlis@etu.u-pec.fr",
        "telephone": "+33769415909",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Vitry-sur-Seine",
          "postalCode": "94400",
          "addressCountry": "FR"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "IUT de Créteil-Vitry, Université Paris-Est Créteil"
        },
        "knowsLanguage": ["fr", "en", "es"],
        "knowsAbout": [
          "Développement web",
          "TypeScript",
          "React",
          "Python",
          "Flask",
          "SQL",
          "OCR",
          "Automatisation",
          "Intelligence artificielle"
        ],
        "sameAs": [
          "https://github.com/Nayarr",
          "https://linkedin.com/in/oughlis-rayan/",
          "https://instagram.com/rayan.ough"
        ]
      }
    </script>

    <div id="root">
